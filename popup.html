<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AW Domain Prefix</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        width: 240px;
        padding: 14px;
        margin: 0;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        cursor: pointer;
      }
      p {
        font-size: 12px;
        color: #666;
        margin: 10px 0 0;
      }
    </style>
  </head>
  <body>
    <label>
      <input type="checkbox" id="toggle" />
      Append domain to tab titles
    </label>
    <p>Adds " [domain]" to the end of every page title so tools like ActivityWatch can identify pages by site.</p>
    <script src="popup.js"></script>
  </body>
</html>
